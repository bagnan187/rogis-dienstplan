name: Build ROGIS Control Centre

on:
  push:
    branches:
      - feature/control-centre-rebuild
      - main
      - fix/annual-free-days-v6433
      - fix/depot-autorepair-v6432
      - fix/website-current-slot-v6431
      - fix/slot-label-parser-v6430
      - fix/ecitarog-hall-slots-v6429
      - fix/depot-length-only-v6428
      - fix/depot-d1-schema-v6427
      - fix/depot-api-v6426b
      - fix/depot-system-v6425
    paths:
      - "control-centre/**"
      - ".github/workflows/control-centre-build.yml"
      - "src/index.js"
      - "public/index.html"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Check Dienstplan Worker syntax
        run: node --check src/index.js
      - name: Publish Windows x64
        run: dotnet publish control-centre/ROGIS.ControlCentre.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o control-centre-publish
      - name: Upload Control Centre
        uses: actions/upload-artifact@v4
        with:
          name: ROGIS-Control-Centre-win64
          path: control-centre-publish/**
